<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial laboral</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header bg-success text-white px-4 py-4 shadow-lg">
    <div class="container">
      <h1 class="mb-1 text-3xl fw-bold">Portafolio</h1>
      <p class="tagline mb-3 text-green-100">Historial laboral</p>

      <nav class="main-nav">
        <ul class="mb-0 flex flex-wrap gap-4 list-unstyled">
          <li>
            <a href="index.html" class="fw-semibold text-white text-decoration-none hover:text-green-200">
              Inicio
            </a>
          </li>
          <li>
            <a href="historial.html" class="fw-semibold text-white text-decoration-none hover:text-green-200">
              Historial laboral
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <section class="rounded-lg bg-white p-4 shadow-md">
          <h2 class="mb-4 border-bottom border-success border-2 pb-2 text-2xl fw-bold text-success-emphasis">
            Historial laboral
          </h2>

          <ul id="listaLaboral" class="list-disc space-y-3 ps-4 text-secondary">
            <li>Monitor académico</li>
            <li>Consultor</li>
          </ul>

          <button
            type="button"
            class="btn btn-outline-success mt-3 d-flex align-items-center gap-2"
            onclick="agregarLaboral()"
          >
            <span class="border border-success rounded px-1 fw-bold lh-1">+</span>
            Agregar
          </button>

          <h2 class="mb-3 mt-4 border-bottom border-success border-2 pb-2 text-2xl fw-bold text-success-emphasis">
            Descripción
          </h2>

          <p class="mb-0 text-secondary">
            Experiencia en acompañamiento académico, orientación a estudiantes
            y apoyo en diferentes actividades profesionales.
          </p>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer bg-dark py-4 text-center text-white">
    <p class="mb-0">Portafolio personal - 2026</p>
  </footer>
<script src="script.js"></script>
</body>
</html>
